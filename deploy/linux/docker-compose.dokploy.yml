services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: local
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Les six modes releves sur la production (MySQL 8.4.11,
      # `SELECT @@GLOBAL.sql_mode`), ecrits tels quels. Une version
      # anterieure n'en epinglait que trois : elle aurait RETIRE
      # ONLY_FULL_GROUP_BY, NO_ZERO_IN_DATE et NO_ZERO_DATE au prochain
      # redemarrage, sur une base ou 32 requetes agregent — dont la caisse
      # et les statistiques envoyees a la DREN.
      #
      # Pourquoi les ecrire alors qu'ils sont deja le defaut : une colonne
      # NOT NULL sans defaut est ce qui empeche d'enregistrer un eleve sans
      # cle de recherche, donc invisible a la detection de doublon. Hors
      # mode strict, MySQL y mettrait une chaine vide sans rien dire. Cette
      # protection cesse d'etre une hypothese sur le moteur.
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - klassci_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - klassci

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - klassci_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - klassci

  backend:
    image: ${KLASSCI_BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/{tenant}
      REDIS_URL: redis://redis:6379/0
      # Racine des televersements : photos/, signatures/, logos/. L'application
      # monte cette racine sur /uploads, donc les URL publiques ne bougent pas.
      # Cette variable est lue par le backend depuis la PR #369, qui sort les
      # ecritures de /tmp. Les deux doivent partir ensemble : ce compose seul
      # monterait le volume la ou le code n'ecrit pas encore, et le code seul
      # ecrirait la ou aucun volume n'est monte.
      UPLOAD_ROOT: /app/uploads
      # Sas de depot : les photos qu'un telephone envoie et qu'aucun operateur
      # n'a encore validees. Racine SEPAREE d'UPLOAD_ROOT, et ce n'est pas un
      # rangement : le backend monte UPLOAD_ROOT en entier sous /uploads, sans
      # authentification ni cloisonnement de tenant. Une photo de mineur en
      # attente de validation y serait publique.
      HANDOFF_ROOT: /app/handoff
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      # Les televersements vivaient dans la couche jetable du conteneur, sous
      # /tmp : la premiere photo d eleve disparaissait au deploiement suivant,
      # et le logo avec elle, sans que rien ne le signale sur les bulletins.
      # Constate en production le 2026-08-31.
      #
      # Le backend est le service qui recoit les fichiers (photo d eleve,
      # signature du chef d etablissement, logo) et le seul qui les SERT :
      # son montage StaticFiles sur /uploads exige que le dossier existe des
      # le demarrage. Sans volume, il le recree vide a chaque conteneur.
      - klassci_uploads:/app/uploads
      # Le sas de depot. Il n'est PAS monte pour durer - une session de depot
      # vit dix minutes - mais pour etre le MEME dossier ici et dans le worker :
      # le backend y ecrit ce qu'un telephone envoie, le worker y balaiera les
      # fichiers qu'aucun operateur n'a confirmes. Sans ce partage, le balayeur
      # regarderait un dossier vide pendant que les photos s'entassent dans la
      # couche jetable du backend.
      - klassci_handoff:/app/handoff
    networks:
      - klassci
      - dokploy-network

  worker:
    image: ${KLASSCI_BACKEND_IMAGE}
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/{tenant}
      REDIS_URL: redis://redis:6379/0
      # Meme racine que le backend, meme valeur, meme volume : un document
      # produit ici doit etre lisible par celui qui le sert.
      UPLOAD_ROOT: /app/uploads
      # Meme sas que le backend, meme valeur, meme volume : le backend y depose
      # ce qu'un telephone envoie, le worker y balaie ce que personne n'a
      # confirme. Deux valeurs differentes, et le balayage passe a cote.
      HANDOFF_ROOT: /app/handoff
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Le worker est le service qui execute les taches, donc celui ou la
      # generation de documents a vocation a tourner. Un document composite va
      # CHERCHER dans cette racine le logo, la signature du chef et les photos
      # d eleves a incruster : sans le volume il lirait un dossier vide et
      # rendrait des bulletins sans logo ni signature, sans erreur ni trace.
      # C'est l'echec qui ne se voit qu'a l'impression, une fois distribue.
      #
      # Au 2026-08-31 ses trois familles de taches (emploi du temps, audit,
      # caisse) n'ouvrent encore aucun fichier. Le montage est neanmoins pose
      # des maintenant : il tourne sur la MEME image et le meme code que le
      # backend, et la premiere tache qui composera un document ne doit pas
      # dependre de quelqu'un se souvenant d'ajouter un volume ce jour-la.
      - klassci_uploads:/app/uploads
      # Le sas, monte ici pour que le balayage des depots orphelins voie les
      # fichiers que le backend y ecrit. Le TTL Redis fait disparaitre la
      # session, pas le fichier : sans ce montage, le sas accumulerait des
      # photos d'eleves indefiniment, et la tache qui doit les effacer
      # tournerait sur un dossier vide en rapportant zero.
      - klassci_handoff:/app/handoff
    networks:
      - klassci

  # `beat` n'a deliberement ni volume ni UPLOAD_ROOT : il ne fait que publier
  # les declencheurs dans Redis a l'heure dite, il n'execute aucune tache et
  # n'ouvre donc jamais un fichier. Lui monter le volume laisserait croire le
  # contraire au prochain lecteur.
  beat:
    image: ${KLASSCI_BACKEND_IMAGE}
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/{tenant}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klassci

  frontend:
    image: ${KLASSCI_FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /svc
      INTERNAL_API_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_EXTRA_ALLOWED_HOSTS: ${NEXT_PUBLIC_EXTRA_ALLOWED_HOSTS}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - klassci
      - dokploy-network

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8088:80"
    volumes:
      - /etc/dokploy/compose/klassci-college-prod/code/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - klassci
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.klassci-college.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.klassci-college.entrypoints=websecure
      - traefik.http.routers.klassci-college.tls=true
      - traefik.http.routers.klassci-college.tls.certresolver=letsencrypt
      - traefik.http.routers.klassci-college.service=klassci-college
      - traefik.http.services.klassci-college.loadbalancer.server.port=80
      - traefik.http.routers.klassci-college-http.rule=Host(`${PUBLIC_HOST}`) && !PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.klassci-college-http.entrypoints=web
      - traefik.http.routers.klassci-college-http.middlewares=redirect-to-https@file
      - traefik.http.routers.klassci-college-ip.rule=Host(`169.58.156.206`)
      - traefik.http.routers.klassci-college-ip.entrypoints=web
      - traefik.http.routers.klassci-college-ip.service=klassci-college

volumes:
  # `klassci_uploads` existe DEJA sur le serveur de production et porte des
  # fichiers : au 2026-08-31, `linux_klassci_uploads` contient le logo du
  # college Rostan. Il est donc `external`, comme les deux autres, pour etre
  # adopte et non recree a cote. Le declarer autrement fabriquerait un volume
  # neuf et vide, et le logo cesserait d'exister aux yeux de l'application
  # sans que rien ne soit efface : le pire des deux mondes, une donnee bien
  # vivante que plus personne ne sert.
  # Le prefixe est surchargeable, et c'est un garde, pas une commodite.
  #
  # Ces volumes etaient epingles a `linux_klassci_*` en dur. Toute seconde pile
  # montee depuis ce fichier - un test de restauration, une copie de recette -
  # s'attachait donc aux donnees de la production. Constate le 2026-08-25 en
  # essayant justement de restaurer a cote : MySQL refusait de verrouiller
  # `ibdata1`, deja tenu par la production.
  #
  # Le refus etait la chance. Si la production avait ete arretee - pendant une
  # migration, une fenetre de maintenance, c'est-a-dire exactement quand on
  # restaure - la pile de test aurait demarre sur ses donnees et reinitialise
  # le mot de passe applicatif avec le sien.
  #
  # Pour une pile jetable : creer les volumes prefixes d'abord, puis
  #   KLASSCI_VOLUME_PREFIX=restoretest docker compose -p restoretest up -d
  klassci_uploads:
    external: true
    name: ${KLASSCI_VOLUME_PREFIX:-linux}_klassci_uploads
  # `klassci_handoff` n'existe pas encore sur le serveur : il est donc declare
  # normalement, et docker le creera. Le mettre `external` comme ses voisins
  # ferait echouer le `up` sur un volume introuvable, alors que ceux-la sont
  # externes precisement parce qu'ils portaient deja des donnees a adopter.
  #
  # Il n'a rien a conserver : un depot non confirme vit dix minutes, et le
  # perdre au redeploiement ne coute qu'une photo a reprendre. Ce qu'il porte,
  # c'est le partage entre le backend qui ecrit et le worker qui balaie.
  klassci_handoff:
    name: ${KLASSCI_VOLUME_PREFIX:-linux}_klassci_handoff
  klassci_mysql:
    external: true
    name: ${KLASSCI_VOLUME_PREFIX:-linux}_klassci_mysql
  klassci_redis:
    external: true
    name: ${KLASSCI_VOLUME_PREFIX:-linux}_klassci_redis

networks:
  klassci:
  dokploy-network:
    external: true


name: Deploy BE to EC2

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-be-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build wheelhouse + ship + migrate + restart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache wheelhouse
        id: wheels-cache
        uses: actions/cache@v4
        with:
          path: wheels/
          # Re-build wheelhouse uniquement quand requirements.txt change
          key: wheels-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Build wheelhouse (if cache miss)
        if: steps.wheels-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip wheel
          pip wheel --wheel-dir=wheels -r requirements.txt
          ls -lh wheels/ | head -10

      - name: Pack artifacts
        run: |
          tar czf wheels.tgz wheels/
          tar czf code.tgz app alembic alembic.ini scripts requirements.txt
          ls -lh wheels.tgz code.tgz

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # ssh-keyscan en best-effort : si l'host est down (instance stoppée, IP
          # changée, network down), le workflow continue. Le scp/ssh suivants
          # utilisent StrictHostKeyChecking=accept-new pour TOFU et lèveront
          # l'erreur réelle (connection refused, timeout) si le host est down.
          ssh-keyscan -H -T 10 ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "ssh-keyscan failed (host unreachable?), falling back to accept-new"

      - name: Prepare shared document seal key bundle
        env:
          SEAL_KEY_ID: ${{ secrets.DOCUMENT_SEAL_ACTIVE_KEY_ID }}
          SEAL_PRIVATE_KEY: ${{ secrets.DOCUMENT_SEAL_PRIVATE_KEY_B64 }}
          SEAL_PUBLIC_KEYS: ${{ secrets.DOCUMENT_SEAL_PUBLIC_KEYS_JSON }}
        run: |
          set -euo pipefail
          test -n "$SEAL_KEY_ID"
          test -n "$SEAL_PRIVATE_KEY"
          test -n "$SEAL_PUBLIC_KEYS"
          umask 077
          printf 'DOCUMENT_SEAL_ACTIVE_KEY_ID=%s\n' "$SEAL_KEY_ID" > document-seal.env
          printf 'DOCUMENT_SEAL_PRIVATE_KEY_B64=%s\n' "$SEAL_PRIVATE_KEY" >> document-seal.env
          printf 'DOCUMENT_SEAL_PUBLIC_KEYS_JSON=%s\n' "$SEAL_PUBLIC_KEYS" >> document-seal.env

      - name: Ship + install (no compile) + alembic + restart + health + rollback
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          scp $SSH_OPTS wheels.tgz code.tgz document-seal.env ubuntu@$HOST:/tmp/
          ssh $SSH_OPTS ubuntu@$HOST 'flock -w 300 /tmp/klassci-deploy.lock bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/document-seal.env' EXIT
          APP=/home/ubuntu/klassci/klassci-backend
          cd "$APP"
          source .venv/bin/activate

          # Install pre-built wheels (no compilation on prod — rule deploy.md)
          tar xzf /tmp/wheels.tgz -C /tmp/
          pip install --no-index --find-links=/tmp/wheels -r requirements.txt

          # Snapshot code BEFORE replacing — rollback target
          tar czf /tmp/code-prev.tgz app alembic
          tar xzf /tmp/code.tgz

          sudo install -m 0644 scripts/klassci-backend.service \
            /etc/systemd/system/klassci-backend.service
          sudo systemctl daemon-reload

          # Trust only the local proxy and make it overwrite client-supplied XFF.
          matched_nginx_site=0
          for enabled in /etc/nginx/sites-enabled/*; do
            if grep -q 'server_name college\.klassci\.com' "$enabled"; then
              matched_nginx_site=1
              target=$(readlink -f "$enabled")
              sudo sed -i \
                -e 's/\$proxy_add_x_forwarded_for/\$remote_addr/g' \
                -e 's/client_max_body_size 25M/client_max_body_size 21M/g' \
                "$target"
              if grep -q '\$proxy_add_x_forwarded_for' "$target"; then
                echo "::error::Unsafe X-Forwarded-For remains in $target"
                exit 1
              fi
              if ! grep -q 'client_max_body_size 21M' "$target"; then
                echo "::error::21M body limit missing from $target"
                exit 1
              fi
            fi
          done
          if [ "$matched_nginx_site" -ne 1 ]; then
            echo "::error::No active KLASSCI nginx site found"
            exit 1
          fi
          sudo nginx -t
          sudo systemctl reload nginx

          # Provision dedicated Ed25519 material once, without printing secrets.
          python scripts/provision_document_seal_env.py \
            --env-file .env \
            --key-file /tmp/document-seal.env

          # Migrations BEFORE restart (expand-contract — old code still runs OK
          # against new schema). Si fail → rollback code, ne PAS restart.
          if ! python -m app.cli.migrate_all head; then
            echo "::error::Alembic migration failed. Rolling back code (BE not restarted)."
            tar xzf /tmp/code-prev.tgz
            exit 1
          fi

          # Restart les 2 services BE
          sudo systemctl restart klassci-backend klassci-celery

          # Health check retry
          for i in 1 2 3 4 5 6; do
            sleep 3
            if curl -fsS -o /dev/null http://localhost:8000/health; then
              echo "BE health OK after attempt $i"
              exit 0
            fi
          done

          echo "::error::BE health failed. Rolling back code (migrations stay forward — manual fix if needed)."
          tar xzf /tmp/code-prev.tgz
          sudo systemctl restart klassci-backend klassci-celery
          exit 1
          REMOTE

      - name: Verify HTTPS endpoint
        run: |
          curl -fsS -o /dev/null -w "BE /api-be/health %{http_code} (%{time_total}s)\n" https://college.klassci.com/api-be/health

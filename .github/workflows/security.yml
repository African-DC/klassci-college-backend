name: Security — Backend

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, staging, main]
  schedule:
    # Scan hebdomadaire chaque lundi à 8h UTC
    - cron: '0 8 * * 1'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit tools
        run: pip install pip-audit safety

      - name: pip-audit — check for known vulnerabilities
        run: |
          pip-audit -r requirements.txt \
            --output cyclonedx-json \
            --output-file pip-audit-report.json \
            --no-deps \
            2>&1 || true
          pip-audit -r requirements.txt --no-deps

      - name: Safety — additional CVE database check
        run: |
          safety check -r requirements.txt --output text
        continue-on-error: true  # ne pas bloquer sur un false positive

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  sast:
    name: SAST — Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Bandit — SAST scan
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            2>&1 || true
          # Afficher le résumé lisible
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet pour détecter les secrets anciens

      - name: TruffleHog — scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

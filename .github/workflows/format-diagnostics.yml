name: Ruff formatting diagnostics temporary
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  show-ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.12
      - name: Show exact formatting changes, no write
        run: ruff format --diff tests/test_preflight_readonly.py || true

name: CI — Backend

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy type check (P0a strict modules — dette legacy en TODO P1)
        run: |
          # Dette technique : 147 erreurs mypy strict sur le legacy, à fixer en S2.
          # En attendant on garantit le strict sur les modules P0a + les fichiers
          # nouvellement écrits ou refondus (Sentry init, security wrappers).
          mypy --ignore-missing-imports \
            app/core/middleware.py \
            app/core/config.py \
            app/core/security.py \
            app/core/sentry.py \
            app/services/email_service.py \
            app/cli/provision_tenant.py \
            app/core/names.py \
            app/services/duplicates/similarity.py \
            app/services/duplicates/detection.py \
            app/routers/duplicates.py

  migrations:
    name: Alembic migrations idempotence
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: klassci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DATABASE_URL: mysql+aiomysql://root:testpassword@localhost:3306/klassci_test
      SECRET_KEY: test-secret-key-for-ci-only
      REDIS_URL: redis://localhost:6379
      APP_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -ptestpassword --silent && break
            sleep 2
          done

      - name: Upgrade head
        run: alembic upgrade head

      - name: Downgrade base
        run: alembic downgrade base

      - name: Upgrade head again (idempotence check)
        run: alembic upgrade head

      - name: Detect schema drift vs models
        # TODO P1 (S2) : reactiver. Le legacy a des drifts indexes pré-existants.
        continue-on-error: true
        run: |
          # Check there's no pending autogenerate diff (models == DB)
          alembic check 2>&1 || echo "::warning::Schema drift detected — voir TODO P1"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: klassci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DATABASE_URL: mysql+aiomysql://root:testpassword@localhost:3306/klassci_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-for-ci-only
      APP_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        if: always()
        with:
          file: coverage.xml

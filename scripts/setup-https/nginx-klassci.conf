# /etc/nginx/sites-available/klassci.conf
#
# KLASSCI College — reverse proxy multi-tenant subdomain
# - api.college.klassci.com         → backend uvicorn 8000
# - <tenant>.college.klassci.com    → frontend Next.js 3000 (multi-tenant)
# - college.klassci.com             → frontend (page d'entrée / login central)
#
# SSL via Let's Encrypt wildcard (DNS-01 Cloudflare).
# Certificate path : /etc/letsencrypt/live/college.klassci.com/

# ──────────────────────────────────────────────────────────────────────────────
# Redirect HTTP → HTTPS pour tous les sous-domaines college
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name college.klassci.com *.college.klassci.com;

    # Allow Let's Encrypt HTTP-01 challenge (en backup au DNS-01)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# API Backend — api.college.klassci.com
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.college.klassci.com;

    ssl_certificate     /etc/letsencrypt/live/college.klassci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/college.klassci.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (défense en profondeur, en plus du Next.js header)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 21M;  # Upload documents, bounded again by the application.

    # Static uploads (photos, documents) — servis directement par nginx
    location /static/ {
        alias /home/ubuntu/klassci/klassci-backend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Multi-tenant : transmettre Host pour que le middleware extrait le tenant
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE support (future realtime)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Long-running requests (génération bulletins PDF, EDT solver)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# Frontend Next.js — college.klassci.com et *.college.klassci.com (tenants)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name college.klassci.com *.college.klassci.com;

    ssl_certificate     /etc/letsencrypt/live/college.klassci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/college.klassci.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 21M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  120s;
        proxy_connect_timeout 30s;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# Default catch-all — rejeter tout host non listé (défense en profondeur)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/college.klassci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/college.klassci.com/privkey.pem;

    return 444;  # Close connection sans réponse
}
